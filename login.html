<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Sign In</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: #f5f5f5;

  background:
    radial-gradient(
      circle at 80% 10%,
      rgba(240,185,11,0.12),
      transparent 32%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(240,185,11,0.06),
      transparent 32%
    ),
    #0b0e11;

  display: flex;
  justify-content: center;
  align-items: center;
}

body::before {
  content: "₿";
  position: fixed;
  right: -70px;
  bottom: -90px;
  font-size: 280px;
  font-weight: bold;
  color: rgba(240,185,11,0.035);
  z-index: -1;
}

.login-container {
  width: 100%;
  max-width: 430px;
  padding: 20px;
}

.login-card {
  background: #181a20;
  border: 1px solid #2b2f36;
  padding: 35px;
  border-radius: 14px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.35);
}


/* LOGO */

.logo {
  text-align: center;
  margin-bottom: 30px;
}

.logo-icon {
  width: 62px;
  height: 62px;
  margin: 0 auto 15px;

  background: #f0b90b;
  color: #111111;

  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 38px;
  font-weight: bold;
}

.logo h1 {
  margin: 0;
  color: #f0b90b;
  font-size: 28px;
}

.logo p {
  color: #9ca3af;
  margin-top: 8px;
}

.account-badge {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 12px;
  background: rgba(240,185,11,0.10);
  border: 1px solid rgba(240,185,11,0.20);
  border-radius: 20px;
  font-size: 12px;
  color: #f0b90b;
}


/* FORM */

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
  color: #d1d5db;
}

input {
  width: 100%;
  padding: 13px;
  margin-bottom: 20px;

  background: #20232a;
  color: #ffffff;

  border: 1px solid #3a3f47;
  border-radius: 7px;

  font-size: 16px;
}

input:focus {
  outline: none;
  border-color: #f0b90b;
}

button {
  width: 100%;
  padding: 14px;

  border: none;
  border-radius: 7px;

  background: #f0b90b;
  color: #111111;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  background: #f8d33a;
}

.message {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  color: #ff7070;
  min-height: 20px;
}

.note {
  margin-top: 25px;
  padding-top: 18px;
  border-top: 1px solid #2b2f36;

  text-align: center;
  color: #848e9c;
  font-size: 12px;
  line-height: 1.5;
}


/* MOBILE */

@media(max-width: 500px) {

  .login-card {
    padding: 28px 22px;
  }

  .logo h1 {
    font-size: 24px;
  }

}

</style>
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <div class="logo">

      <div class="logo-icon">
        ₿
      </div>

      <h1>Account Sign In</h1>

      <p>
        Sign in to your account
      </p>

      <div class="account-badge">
      REAL BINANCE ACCOUNT
      </div>

    </div>


    <form onsubmit="login(event)">

      <label for="username">
        Username
      </label>

      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >


      <button type="submit">
        Sign In
      </button>

    </form>


    <div
      class="message"
      id="message">
    </div>


    <div class="note">
      REAL BINANCE INVESTMENT ACCOUNT 
    </div>

  </div>

</div>


<script>

function login(event) {

  event.preventDefault();


  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  /* ACCOUNT USERNAME */

  const accountUsername =
    "Betina Guter";


  /* DEFAULT PASSWORD */

  const defaultPassword =
    "Betina@@11";


  /* CHECK FOR PASSWORD CHANGED IN SETTINGS */

  const savedPassword =
    localStorage.getItem("demoAccountPassword");


  const correctPassword =
    savedPassword || defaultPassword;


  /* LOGIN CHECK */

  if (
    username === accountUsername &&
    password === correctPassword
  ) {

    sessionStorage.setItem("loggedIn", "yes");
window.location.href = "index.html";
  } else {

    message.textContent =
      "Incorrect username or password.";

  }

}

</script>

</body>
</html>
```
