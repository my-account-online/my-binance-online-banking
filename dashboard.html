<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Online Bank - Prototype</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .balance-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .balance-title {
      color: #6b7280;
      font-size: 14px;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      margin-top: 8px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .buttons button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .buttons button:hover {
      background: #374151;
    }

    .transactions {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .transaction:last-child {
      border-bottom: none;
    }

    .transaction-name {
      font-weight: bold;
    }

    .transaction-date {
      font-size: 13px;
      color: #6b7280;
      margin-top: 5px;
    }

    .incoming {
      color: #15803d;
      font-weight: bold;
    }

    .outgoing {
      color: #b91c1c;
      font-weight: bold;
    }

    .prototype-note {
      margin-top: 25px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }

    @media (max-width: 600px) {
      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>My Online Bank</h1>
  </div>

  <div class="container">

    <div class="welcome">
      <h2>Welcome, Betina Guter</h2>
      <p>Your account overview</p>
    </div>

    <div class="balance-card">
      <div class="balance-title">Available Balance</div>

      <div class="balance">
        €180,000.00
      </div>
    </div>

    <div class="buttons">

      <button onclick="window.location.href='deposit.html'">
        Deposit
      </button>

      <button onclick="window.location.href='transfer.html'">
        Transfer
      </button>

      <button onclick="window.location.href='withdraw.html'">
        Withdraw
      </button>

    </div>

    <div class="transactions">

      <h2>Transaction History</h2>

      <div class="transaction">

        <div>
          <div class="transaction-name">
            Deposit
          </div>

          <div class="transaction-date">
            Binance Profit
          </div>
        </div>

        <div class="incoming">
          +€180,000.00
        </div>

      </div>

    </div>

    <div class="prototype-note">
      Prototype banking interface — no real financial transactions are processed.
    </div>

  </div>

</body>
</html>
```
