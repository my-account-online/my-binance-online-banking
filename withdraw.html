<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTC Withdraw Online Banking</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: #f5f5f5;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 80% 10%,
      rgba(240,185,11,0.12),
      transparent 32%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(240,185,11,0.06),
      transparent 32%
    ),
    #0b0e11;
}

body::before {
  content: "₿";
  position: fixed;
  right: -80px;
  bottom: -100px;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 240px;
  font-weight: bold;
  color: rgba(240,185,11,0.035);
  border: 1px solid rgba(240,185,11,0.07);
  z-index: -1;
}

/* HEADER */

.header {
  background: #181a20;
  border-bottom: 1px solid #2b2f36;
  padding: 16px 20px;
}

.header-inner {
  max-width: 950px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #f0b90b;
  color: #111111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

.brand-name {
  color: #f0b90b;
  font-size: 20px;
  font-weight: bold;
}

.brand-subtitle {
  color: #848e9c;
  font-size: 11px;
  margin-top: 3px;
}

.dashboard {
  background: #f0b90b;
  color: #111111;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.dashboard:hover {
  background: #f8d33a;
}

/* MAIN */

.container {
  max-width: 650px;
  margin: 60px auto;
  padding: 20px;
}

.card {
  background: #181a20;
  border: 1px solid #2b2f36;
  border-radius: 14px;
  padding: 35px;
  text-align: center;
  box-shadow: 0 12px 35px rgba(0,0,0,0.35);
}

.withdraw-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: rgba(240,185,11,0.10);
  border: 1px solid rgba(240,185,11,0.25);
  color: #f0b90b;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

h1 {
  margin: 0 0 18px;
  color: #ffffff;
  font-size: 28px;
}

.description {
  color: #d1d5db;
  line-height: 1.6;
  font-size: 17px;
  margin-bottom: 25px;
}

.fee {
  color: #f0b90b;
  font-size: 32px;
  font-weight: bold;
  margin: 15px 0 25px;
}

.status {
  background: rgba(240,185,11,0.07);
  border: 1px solid rgba(240,185,11,0.18);
  border-radius: 8px;
  padding: 15px;
  color: #9ca3af;
  line-height: 1.5;
  margin-bottom: 25px;
}

.back {
  display: inline-block;
  background: #f0b90b;
  color: #111111;
  text-decoration: none;
  padding: 13px 22px;
  border-radius: 7px;
  font-weight: bold;
}

.back:hover {
  background: #f8d33a;
}

.notice {
  margin-top: 25px;
  padding-top: 18px;
  border-top: 1px solid #2b2f36;
  color: #848e9c;
  font-size: 13px;
  line-height: 1.5;
}

/* MOBILE */

@media(max-width:600px) {

  .container {
    margin: 30px auto;
    padding: 15px;
  }

  .card {
    padding: 25px 20px;
  }

  h1 {
    font-size: 24px;
  }

  .fee {
    font-size: 28px;
  }

  .brand-name {
    font-size: 17px;
  }

  .logo {
    width: 38px;
    height: 38px;
    font-size: 25px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <div class="header-inner">

    <div class="brand">

      <div class="logo">₿</div>

      <div>

        <div class="brand-name">
          BTC Withdraw Online Banking
        </div>

        <div class="brand-subtitle">
          Account
        </div>

      </div>

    </div>

    <button
      class="dashboard"
      onclick="location.href='index.html'">

      Dashboard

    </button>

  </div>

</div>


<!-- MAIN -->

<div class="container">

  <div class="card">

    <div class="withdraw-icon">
      ↓
    </div>

    <h1>
      Withdraw Unavailable
    </h1>

    <div class="description">
      You are required to have a transfer fee of
      <strong>€1,000</strong>.
    </div>

    <div class="fee">
      €1,000.00
    </div>

    <div class="status">
      This fee requirement is part of this
      simulated account demonstration.
    </div>

    <a
      class="back"
      href="index.html">

      ← Return to Dashboard

    </a>

    <div class="notice">
      Account — withdrawals are not available
      in this simulated environment.
    </div>

  </div>

</div>

</body>
</html>
```
