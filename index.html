<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTC Online Banking</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: #f5f5f5;
  background:
    radial-gradient(circle at 80% 10%, rgba(240,185,11,0.09), transparent 30%),
    radial-gradient(circle at 10% 90%, rgba(240,185,11,0.05), transparent 30%),
    #0b0e11;
  min-height: 100vh;
}

body::before {
  content: "₿";
  position: fixed;
  right: -80px;
  bottom: -100px;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 240px;
  font-weight: bold;
  color: rgba(240,185,11,0.035);
  border: 1px solid rgba(240,185,11,0.07);
  z-index: -1;
}

.header {
  background: #181a20;
  border-bottom: 1px solid #2b2f36;
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1000px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #f0b90b;
  color: #111111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-name {
  color: #f0b90b;
  font-size: 20px;
  font-weight: bold;
}

.brand-subtitle {
  color: #848e9c;
  font-size: 11px;
  margin-top: 3px;
}

.signout {
  background: #f0b90b;
  color: #111111;
  border: none;
  padding: 10px 17px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.signout:hover {
  background: #f8d33a;
}

.container {
  max-width: 1000px;
  margin: 35px auto;
  padding: 20px;
}

.welcome {
  margin-bottom: 25px;
}

.welcome h2 {
  margin: 0 0 7px;
  font-size: 27px;
  color: #ffffff;
}

.welcome p {
  margin: 0;
  color: #9ca3af;
}

.balance-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #181a20, #20232a);
  border: 1px solid #2b2f36;
  padding: 30px;
  border-radius: 12px;
  margin-bottom: 25px;
}

.balance-card::after {
  content: "₿";
  position: absolute;
  right: 35px;
  top: 8px;
  font-size: 125px;
  font-weight: bold;
  color: rgba(240,185,11,0.07);
}

.balance-title {
  color: #9ca3af;
  font-size: 14px;
  position: relative;
  z-index: 2;
}

.balance {
  color: #f0b90b;
  font-size: 40px;
  font-weight: bold;
  margin-top: 9px;
  position: relative;
  z-index: 2;
}

.card {
  background: #181a20;
  color: #ffffff;
  padding: 25px;
  border-radius: 12px;
  margin-bottom: 25px;
  border: 1px solid #2b2f36;
}

.card h2 {
  margin-top: 0;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.summary-item {
  background: #20232a;
  padding: 17px;
  border-radius: 8px;
  border: 1px solid #2b2f36;
}

.summary-label {
  color: #848e9c;
  font-size: 13px;
  margin-bottom: 7px;
}

.summary-value {
  color: #f5f5f5;
  font-weight: bold;
  font-size: 16px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 25px;
}

.buttons button {
  padding: 15px;
  border: 1px solid #2b2f36;
  border-radius: 7px;
  background: #181a20;
  color: #f5f5f5;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.buttons button:hover {
  background: #20232a;
  color: #f0b90b;
  border-color: #f0b90b;
}

.transaction {
  display: flex;
  justify-content: space-between;
  padding: 18px 0;
  border-bottom: 1px solid #2b2f36;
  gap: 20px;
}

.small {
  color: #848e9c;
  font-size: 13px;
  margin-top: 5px;
}

.green {
  color: #0ecb81;
  font-weight: bold;
  white-space: nowrap;
}

.note {
  text-align: center;
  color: #848e9c;
  font-size: 13px;
  margin: 25px 0;
}

@media(max-width:700px) {

  .summary-grid,
  .buttons {
    grid-template-columns: 1fr;
  }

  .transaction {
    flex-direction: column;
    gap: 8px;
  }

  .balance {
    font-size: 31px;
  }

  .welcome h2 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-inner">

    <div class="brand">

      <div class="logo">₿</div>

      <div class="brand-text">
        <div class="brand-name">BTC Online Banking</div>

        <div class="brand-subtitle">
        Account
        </div>
      </div>

    </div>

    <button
      class="signout"
      onclick="location.href='login.html'">
      Sign Out
    </button>

  </div>
</div>


<div class="container">

  <div class="welcome">

    <h2>
      Welcome, Betina Guter
    </h2>

    <p>
      Account overview
    </p>

  </div>


  <div class="balance-card">

    <div class="balance-title">
      Available Balance
    </div>

    <div class="balance">
      €180,000.00
    </div>

  </div>


  <div class="card">

    <h2>
      Account Summary
    </h2>

    <div class="summary-grid">

      <div class="summary-item">
        <div class="summary-label">
          Account Holder
        </div>

        <div class="summary-value">
          Betina Guter
        </div>
      </div>


      <div class="summary-item">
        <div class="summary-label">
          Account Status
        </div>

        <div class="summary-value">
          Active
        </div>
      </div>


      <div class="summary-item">
        <div class="summary-label">
          Account Type
        </div>

        <div class="summary-value">
          Binance Account
        </div>
      </div>

    </div>

  </div>


  <div class="buttons">

    <button onclick="location.href='deposit.html'">
      Deposit
    </button>

    <button onclick="location.href='transfer.html'">
      Transfer
    </button>

    <button onclick="location.href='withdraw.html'">
      Withdraw
    </button>

    <button onclick="location.href='profile.html'">
      Profile
    </button>

    <button onclick="location.href='settings.html'">
      Settings
    </button>

  </div>


  <div class="card">

    <h2>
      Transaction History
    </h2>

    <div class="transaction">

      <div>

        <strong>
          Binance Transaction
        </strong>

        <div class="small">
          Deposit
        </div>

      </div>

      <div class="green">
        +€180,000.00
      </div>

    </div>

  </div>


  <div class="note">
    Simulated account interface.
  </div>

</div>

</body>
</html>
```
